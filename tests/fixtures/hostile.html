<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostile form fixture</title>
<style>
body { margin: 20px; font: 16px/1.5 system-ui, sans-serif; }
form { width: 520px; padding: 24px; border: 1px solid #999; }
input { margin: 4px; width: 140px; }
</style>
</head>
<body>
<h1 id="title">Checkout</h1>
<!-- Named form controls replace the form's own DOM properties: form.id, form.children and so on
     return these inputs. Named images and forms do the same to the document. -->
<form id="checkout">
  <p id="form-text">Delivery details</p>
  <input id="field-parent" name="parentElement" value="a">
  <input id="field-children" name="children" value="b">
  <input id="field-id" name="id" value="c"><br>
  <input id="field-attribute" name="getAttribute" value="d">
  <input id="field-closest" name="closest" value="e">
  <input id="field-name" name="localName" value="f"><br>
  <input id="field-connected" name="isConnected" value="g">
  <input id="field-rect" name="getBoundingClientRect" value="h">
  <input id="field-contains" name="contains" value="i">
</form>
<img name="querySelector" alt="" width="20" height="20">
<img name="documentElement" alt="" width="20" height="20">
<form name="createElement"></form>
<p id="after">After the form</p>
</body>
</html>
